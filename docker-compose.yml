services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hermes_postgres
    # Loopback-only: reached over the internal docker network by service name
    # (mem0-server). Never exposed on the host's public interface.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: hermes_auth
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: hermes_neo4j
    # Loopback-only: reached over the internal docker network (mem0-server).
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  mem0-server:
    build:
      context: ./mem0-server
      dockerfile: Dockerfile
    container_name: hermes_mem0
    # Loopback-only: the mem0 API has no auth of its own, so it must never be
    # published on the public interface. Still reachable via localhost:8888
    # (host-network gateway) and by service name on the docker network.
    ports:
      - "127.0.0.1:8888:8888"
    # The Sentinel collector + cycle daemons run inside THIS container (no new
    # container). The supervisor backgrounds them, then execs the mem0 server.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bastion daemons start first (backgrounded, returns), then Sentinel's
    # supervisor backgrounds its daemons and execs the mem0 server as PID 1.
    command: ["bash", "-c", "bash /data/bastion/supervisor.sh; exec bash /data/sentinel/supervisor.sh"]
    volumes:
      - ./sentinel:/data/sentinel:ro
      - ./bastion:/data/bastion:ro
    environment:
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_CLOUD_BASE_URL: https://ollama.com/v1
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-glm-5}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hermes_auth
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      ENABLE_GRAPH: "true"
      PORT: "8888"
      # ── Sentinel daemons ──
      SENTINEL_TARGET_HOST: ${SENTINEL_TARGET_HOST:-}
      SENTINEL_TARGET_USER: ${SENTINEL_TARGET_USER:-root}
      SENTINEL_TARGET_PORT: ${SENTINEL_TARGET_PORT:-22}
      SENTINEL_SSH_KEY: ${SENTINEL_SSH_KEY:-/data/sentinel/id_target}
      SENTINEL_POLL_SECONDS: ${SENTINEL_POLL_SECONDS:-10}
      SENTINEL_CYCLE_SECONDS: ${SENTINEL_CYCLE_SECONDS:-5}
      SENTINEL_MODEL: ${OLLAMA_LLM_MODEL:-glm-5}
      HERMES_GATEWAY_URL: http://host.docker.internal:8642
      HERMES_GATEWAY_API_KEY: ${HERMES_GATEWAY_API_KEY}
      HINDSIGHT_BASE_URL: http://host.docker.internal:9177
      HINDSIGHT_BANK_ID: hermes
      # ── Bastion daemons (SSH perimeter guard — separate from Sentinel) ──
      BASTION_TARGET_HOST: ${BASTION_TARGET_HOST:-${SENTINEL_TARGET_HOST:-}}
      BASTION_TARGET_USER: ${BASTION_TARGET_USER:-${SENTINEL_TARGET_USER:-etech}}
      BASTION_TARGET_PORT: ${BASTION_TARGET_PORT:-${SENTINEL_TARGET_PORT:-22}}
      BASTION_SSH_KEY: ${BASTION_SSH_KEY:-/data/bastion/id_target}
      BASTION_ATTEMPTS: ${BASTION_ATTEMPTS:-5}
      BASTION_WINDOW_SECONDS: ${BASTION_WINDOW_SECONDS:-60}
      BASTION_BLOCK_SECONDS: ${BASTION_BLOCK_SECONDS:-3600}
      BASTION_POLL_SECONDS: ${BASTION_POLL_SECONDS:-5}
      BASTION_CYCLE_SECONDS: ${BASTION_CYCLE_SECONDS:-5}
      BASTION_WHITELIST: ${BASTION_WHITELIST:-}
      BASTION_IPSET_NAME: ${BASTION_IPSET_NAME:-bastion_block}
      BASTION_SUDO: ${BASTION_SUDO:-sudo}
      BASTION_MODEL: ${OLLAMA_LLM_MODEL:-glm-5}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/health | grep -q 'ok'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  control-hub:
    build:
      context: ./hermes-control-hub
      dockerfile: Dockerfile
    container_name: hermes_control_hub
    expose:
      - "42069"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "42069"
      HERMES_HOME: /data/hermes
      CH_DATA_DIR: /data/ch
      MEM0_BASE_URL: http://mem0-server:8888
      MEM0_USER_ID: ${MEM0_USER_ID:-hermes-user}
      NEXT_PUBLIC_APP_URL: https://mc.spacearmour.io
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DATABASE_URL: postgresql://hermes:${POSTGRES_PASSWORD}@postgres:5432/hermes_auth
      HERMES_GATEWAY_URL: http://host.docker.internal:8642
      CONTROL_HUB_LLM_API: http://host.docker.internal:8642/v1/chat/completions
      HERMES_GATEWAY_API_KEY: ${HERMES_GATEWAY_API_KEY}
      # Hide the synthetic "default" (Bob) root agent from the dashboard roster
      # and from push/pull-all. The root config still backs the gateway.
      CH_HIDE_DEFAULT_AGENT: "1"
    volumes:
      # Read-write: the Control Hub writes back into the Hermes home — cron
      # jobs.json (via the Hermes venv Python) and profile config.yaml/SOUL.md
      # (Agents tab "Push"). A read-only mount makes both fail with EACCES.
      # The container drops to the mount-owner uid (see docker-entrypoint.sh),
      # the same identity the host gateway runs as, so writes stay consistent.
      - /home/etech/hermes/.hermes:/data/hermes:rw
      - ch_data:/data/ch
    depends_on:
      mem0-server:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: hermes_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - control-hub
    restart: unless-stopped

volumes:
  postgres_data:
    name: hermes_postgres_data
  neo4j_data:
    name: hermes_neo4j_data
  ch_data:
    name: hermes_ch_data
  certbot_www:
    name: hermes_certbot_www
